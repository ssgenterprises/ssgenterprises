# Radio Replay configuration. Any setting left out uses the built-in default.

[audio]
# 16000 Hz mono is plenty for SSB/FM voice and uses ~8 MB RAM for 240 s.
sample_rate = 16000
channels = 1
# Blank = system default. Otherwise a device index or part of its name,
# e.g. "USB" (see: python3 -m radio_replay.main --list-devices)
input_device = USB
output_device = USB
blocksize = 1024
playback_gain = 1.0
# yes = pass the live receiver audio to the output when not replaying,
# so one speaker serves both live listening and replay.
monitor = no
monitor_gain = 1.0

[buffer]
durations = 5,10,20,30,60,120,240

[gpio]
# BCM GPIO numbers, one per duration above (same order). Wire each button
# between the pin and GND; internal pull-ups are used.
replay_pins = 17,27,22,5,6,13,19
stop_pin = 26
# Press to save the buffer to a WAV file (blank to disable)
save_pin = 21
# LED (through a 330 ohm resistor to GND) lit while replaying (blank to disable)
led_pin = 12
bounce_ms = 50

[save]
directory = ~/radio-replay-clips
seconds = 240
